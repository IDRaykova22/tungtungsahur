<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="nav" class="site-nav">
    <a class="brand" href="/events">
        <span class="brand-icon">D</span>
        <span class="brand-name">Demetra</span>
    </a>
    <nav class="nav-links">
        <a href="/events">Events</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/chat}">My questions</a>
        <a th:href="@{/users}">Users</a>
        <span sec:authorize="hasRole('ORGANIZER')">
            <a href="/events/new">Host an event</a>
        </span>
        <a sec:authorize="hasAnyRole('ORGANIZER', 'MANAGER', 'ADMIN')" th:href="@{/reports}" class="nav-cta">Reports</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/registrations}">Registrations</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/event-deletion-requests}">Deletion requests</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/data-quality}">Data quality</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" class="nav-cta">Administration</a>
        <span sec:authorize="isAuthenticated()" class="nav-user">
            <a th:href="@{/profile}" title="My profile"><span sec:authentication="name">user@example.com</span></a>
            <form method="post" th:action="@{/logout}" class="inline-form">
                <button type="submit" class="link-button">Sign out</button>
            </form>
        </span>
        <span sec:authorize="isAnonymous()">
            <a href="/login">Sign in</a>
            <a href="/register" class="nav-cta">Register</a>
        </span>
    </nav>
</header>
</body>
</html>
