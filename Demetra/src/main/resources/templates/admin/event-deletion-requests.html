<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заявки за изтриване — Demetra</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="page-container">
    <div class="page-header"><h1>Заявки за изтриване на събития</h1></div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="card" th:if="${#lists.isEmpty(requests)}">Няма заявки.</div>
    <div class="card" th:each="request : ${requests}" style="margin-bottom: 16px;">
        <h2 th:text="${request.event.title}">Събитие</h2>
        <p><strong>Manager:</strong> <span th:text="${request.requestedBy.name}"></span></p>
        <p><strong>Причина:</strong> <span th:text="${request.reason}"></span></p>
        <p><strong>Дата:</strong> <span th:text="${#temporals.format(request.createdAt, 'dd.MM.yyyy HH:mm')}"></span></p>
        <p><strong>Статус:</strong> <span th:text="${request.status}"></span></p>
        <div th:if="${request.status.name() == 'PENDING'}">
            <form method="post" style="display:inline" th:action="@{/admin/event-deletion-requests/{id}/approve(id=${request.id})}">
                <button class="btn" type="submit">Одобри</button>
            </form>
            <form method="post" style="display:inline" th:action="@{/admin/event-deletion-requests/{id}/reject(id=${request.id})}">
                <button class="btn btn-secondary" type="submit">Отхвърли</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
